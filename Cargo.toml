[package]
name = "flatline"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bcrypt-pbkdf = "0.11"
bytes = "1.12.0"
cfg-if = "1.0.4"
derive_more = { version = "2.1.1", features = ["debug"] }
easy-ext = "1.0.3"
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
indexmap = "2"
libcrux-ml-kem = "0.0.9"
num-bigint = "0.4.6"
openssl = "0.10"
rand = { version = "0.10.1", features = ["thread_rng"] }
regex = "1.12.4"
snafu = "0.9.1"
tokio = { version = "1", features = ["macros", "net", "sync", "io-util", "rt"] }
tracing = { version = "0.1.44" }
umac = { git = "https://github.com/holdxen/umac.git", rev = "2571a82984d0c928276006f292635369ddaf6c24", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
shlex = "2.0.1"
bitflags = "2.13.0"

[dev-dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
hex = "0.4.3"
serde = "1.0.228"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"


[features]
umac = ["dep:umac"]
